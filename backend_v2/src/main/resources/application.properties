spring.application.name=backend
server.error.include-message=always

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/diabete_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Driver class for PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Updated Dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# INITIALISATION DES DONNÉES (data.sql)
# ==========================================
# Exécuter les scripts SQL même si la BDD n'est pas "embedded" (ex: PostgreSQL)
spring.sql.init.mode=always
# Attendre qu'Hibernate crée les tables AVANT d'exécuter data.sql
spring.jpa.defer-datasource-initialization=true

# Jackson Date Formatting

# ==========================================
# MAILTRAP SMTP (Mot de passe oublié)
# ==========================================
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL du frontend (pour le lien de réinitialisation)
app.frontend-url=http://localhost:3000
# Local credentials are never committed. Run from backend_v2 or repository root.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend_v2/application-local.properties
app.jwt-secret=${JWT_SECRET}
