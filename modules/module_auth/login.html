<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Connexion - DiabeteRisk</title>
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Google Fonts: Manrope -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --primary-blue: #0057cd;
            --primary-hover: #00419e;
            --bg-light: #f8f9fa;
            --text-main: #191c1d;
            --text-secondary: #424655;
            --border-color: #e9ecef;
            --card-shadow: 0px 4px 12px rgba(0, 0, 0, 0.05);
            --card-shadow-hover: 0px 8px 24px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
        }

        .login-card {
            background: #ffffff;
            border: none;
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            max-width: 440px;
            width: 100%;
            transition: box-shadow 0.3s ease;
        }

        .login-card:hover {
            box-shadow: var(--card-shadow-hover);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-control {
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(0, 87, 205, 0.1);
            outline: none;
        }

        .btn-primary {
            background-color: var(--primary-blue);
            border: none;
            padding: 0.875rem;
            font-weight: 700;
            border-radius: 0.5rem;
            transition: background-color 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .link-secondary-ui {
            font-size: 0.875rem;
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .link-secondary-ui:hover {
            text-decoration: underline;
        }

        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .material-symbols-outlined {
            vertical-align: middle;
            font-size: 24px;
        }

        .back-to-home {
            position: absolute;
            top: 2rem;
            left: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .back-to-home:hover {
            color: var(--primary-blue);
        }
    </style>
</head>

<body>
    <div class="login-card p-4 p-md-5">
        <div class="brand-header">
            <h1 class="h3 fw-bold mb-2">Connexion</h1>
            <p class="text-secondary small">Accédez à votre espace pour évaluer votre risque de diabète</p>
        </div>
        <form>
            <div class="mb-3">
                <label class="form-label" for="email">Adresse email</label>
                <input class="form-control" id="email" placeholder="nom@exemple.com" required="" type="email" />
            </div>
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0" for="password">Mot de passe</label>
                    <a class="link-secondary-ui small" href="#">Mot de passe oublié?</a>
                </div>
                <input class="form-control" id="password" placeholder="••••••••" required="" type="password" />
            </div>
            <div class="mb-4 form-check">
                <input class="form-check-input" id="remember" type="checkbox" />
                <label class="form-check-label small text-secondary" for="remember">Se souvenir de moi</label>
            </div>
            <button class="btn btn-primary w-100 mb-3" type="submit">Se connecter</button>
        </form>
        <div class="footer-links">
            <span>Vous n'avez pas de compte?</span>
            <a class="link-secondary-ui ms-1" href="#">Créer un compte</a>
        </div>
    </div>
    <!-- Background Decoration -->
    <div
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; opacity: 0.4;">
        <img data-alt="A clean, professional medical office setting with high-key natural lighting and a minimalist aesthetic. The background features blurred soft white walls and glass surfaces, creating a sense of sterile precision and technological advancement. A subtle blue tint is occasionally visible in the shadows, aligning with the primary brand color. The overall mood is calm, trustworthy, and empathetic, reflecting a modern healthcare environment."
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBloiNAk0b4FAyAOyrCN4PNo1xGCgb53uZ5L1AbnCRVtuvzrAO1vtgDaD6UxP_HPddHG7kZ_XlbGytcdMZkpxicCx_SdMYmbvZ2vOcGKSQ2qAMPaymTyqYfaDmlHheh2rDTmHlX5gJRDjll-1GqKZCfM3zeL5t8J3B4--jfC2c0_iIrAVgxdleQ53tyvHcF0x2ukXrIqgZEmvvm55VV2vDomhHSz5c3ctZ8Sn761mf8wCBwrMtj1u26Nw-ieriy7Lr2WyunTl7xIts"
            style="width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) brightness(1.2);" />
    </div>
</body>

</html>
